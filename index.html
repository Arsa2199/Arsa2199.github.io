<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced Monitoring Dashboard</title>
    <style>
        /* General Styles */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Arial", sans-serif;
            background-color: #f4f7fc;
            color: #333;
            padding: 20px;
        }

        /* Dashboard Container */
        .dashboard {
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
        }

        h1 {
            text-align: center;
            font-size: 2.5rem;
            color: #0056b3;
            margin-bottom: 20px;
        }

        /* Card Layout */
        .card {
            background: #ffffff;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            transition: transform 0.2s ease;
        }

        .card:hover {
            transform: scale(1.02);
        }

        .card-header {
            background: #007BFF;
            color: #fff;
            text-align: center;
            padding: 15px;
            font-size: 1.2rem;
            font-weight: bold;
        }

        .card-body {
            padding: 20px;
            text-align: center;
        }

        /* Table Styling */
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }

        table, th, td {
            border: 1px solid #ddd;
        }

        th, td {
            padding: 10px;
            text-align: center;
        }

        th {
            background-color: #007BFF;
            color: white;
        }

        tr:nth-child(even) {
            background-color: #f2f2f2;
        }

        /* Refresh Button */
        .refresh-btn {
            background-color: #28a745;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 1rem;
            cursor: pointer;
            border-radius: 5px;
            display: block;
            margin: 20px auto;
        }

        .refresh-btn:hover {
            background-color: #218838;
        }
    </style>
</head>
<body>
    <h1>Advanced Item Monitoring Dashboard</h1>

    <!-- Dashboard Container -->
    <div class="dashboard">
        <!-- Data Card -->
        <div class="card">
            <div class="card-header">Item List</div>
            <div class="card-body">
                <table id="item-table">
                    <thead>
                        <tr>
                            <th>#</th>
                            <th>Item Name</th>
                            <th>Quantity</th>
                            <th>Status</th>
                            <th>Last Updated</th>
                        </tr>
                    </thead>
                    <tbody>
                        <!-- Table Rows Will Be Populated Dynamically -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Refresh Button -->
    <button class="refresh-btn" onclick="fetchData()">Refresh Data</button>

    <!-- JavaScript for Data Fetching -->
    <script>
        // Function to Fetch Data from Backend API
        async function fetchData() {
            try {
                const response = await fetch("http://your-backend-url/api/items"); // Replace with your API
                const data = await response.json();

                const tableBody = document.querySelector("#item-table tbody");
                tableBody.innerHTML = ""; // Clear existing table data

                // Populate Table Rows
                data.forEach((item, index) => {
                    const row = `
                        <tr>
                            <td>${index + 1}</td>
                            <td>${item.name}</td>
                            <td>${item.quantity}</td>
                            <td>${item.status}</td>
                            <td>${item.updated_at}</td>
                        </tr>
                    `;
                    tableBody.innerHTML += row;
                });
            } catch (error) {
                console.error("Failed to fetch data:", error);
                alert("Failed to load data. Please check your backend API.");
            }
        }

        // Automatically Fetch Data When Page Loads
        window.onload = fetchData;
    </script>
</body>
</html>
