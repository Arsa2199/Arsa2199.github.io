<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Item Master Display</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background-color: #f4f4f9;
        }
        h1 {
            text-align: center;
            color: #333;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        th, td {
            padding: 10px;
            text-align: center;
            border: 1px solid #ccc;
        }
        th {
            background-color: #007BFF;
            color: white;
        }
        tr:nth-child(even) {
            background-color: #f2f2f2;
        }
        .update-button {
            background-color: #28a745;
            color: white;
            padding: 5px 10px;
            border: none;
            cursor: pointer;
            border-radius: 4px;
        }
        .update-button:hover {
            background-color: #218838;
        }
    </style>
</head>
<body>
    <h1>Item Master Display</h1>
    <!-- Table for displaying item data -->
    <table>
        <thead>
            <tr>
                <th>#</th>
                <th>Item Name</th>
                <th>Quantity</th>
                <th>Status</th>
                <th>Last Updated</th>
            </tr>
        </thead>
        <tbody id="item-table-body">
            <!-- Data will be populated here dynamically -->
        </tbody>
    </table>

    <!-- JavaScript to Fetch Data from Backend -->
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            fetchItems(); // Load data when the page loads
        });

        async function fetchItems() {
            try {
                // Replace this URL with your backend API endpoint
                const response = await fetch("http://your-backend-url/api/items");
                const data = await response.json();

                const tableBody = document.getElementById("item-table-body");
                tableBody.innerHTML = ""; // Clear table before populating

                data.forEach((item, index) => {
                    const row = `
                        <tr>
                            <td>${index + 1}</td>
                            <td>${item.name}</td>
                            <td>${item.quantity}</td>
                            <td>${item.status}</td>
                            <td>${item.updated_at}</td>
                        </tr>
                    `;
                    tableBody.innerHTML += row;
                });
            } catch (error) {
                console.error("Error fetching data:", error);
            }
        }
    </script>
</body>
</html>
