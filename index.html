<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QUALITY CONTROL TEST & FINAL Job Control Panel</title>
  <style>
    body {
      font-family: 'Arial', sans-serif;
      margin: 0;
      background: #fdf3e1;
      color: #333;
    }
    header {
      background: #ff8c00;
      color: white;
      text-align: center;
      padding: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 1000;
    }
    header img {
      height: 50px;
      margin-left: 10px;
    }
    header h1 {
      margin: 0;
      flex-grow: 1;
    }
    .container {
      display: flex;
      flex-wrap: wrap;
      margin: 20px;
    }
    .category {
      flex: 1;
      min-width: 300px;
      margin: 10px;
      background: #ffebcc;
      border: 1px solid #ff8c00;
      border-radius: 8px;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
    }
    .category h2 {
      background: #ff8c00;
      color: white;
      padding: 10px;
      margin: 0;
      text-align: center;
      border-radius: 8px 8px 0 0;
    }
    .item {
      padding: 10px;
      cursor: pointer;
      border-bottom: 1px solid #ff8c00;
      transition: background 0.3s, color 0.3s;
    }
    .item:hover {
      background: #ffd1a3;
      color: #ff4500;
    }
    .item:last-child {
      border-bottom: none;
    }
    #viewer {
      padding: 20px;
      margin: 20px auto;
      max-width: 90%;
      background: white;
      border-radius: 8px;
      border: 1px solid #ddd;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
      display: none;
    }
    footer {
      background: #ff4500;
      color: white;
      text-align: center;
      padding: 10px;
      position: fixed;
      bottom: 0;
      width: 100%;
    }
    iframe {
      width: 100%;
      height: 500px;
      border: none;
    }
  </style>
</head>
<body>
  <header>
    <img src="hitachi-logo.png" alt="Hitachi Logo">
    <h1>Hitachi Job Control Panel</h1>
  </header>

  <div class="container">
    <!-- Power BI Section -->
    <div class="category" id="powerbi">
      <h2>Power BI</h2>
      <div class="item" onclick="openLocalFile('\\hcmi10007.kenki.global.hitachi.net\F-iReporter\Section\QA For Excavator & Reman\03. Power BI\QC Test & Final\Trial\QC PT & BL - Progress & Performance Monitoring.pbix')">1. Blacklight & Performance Test Dashboard</div>
      <div class="item" onclick="openLocalFile('C:/YourPath/powerbi2.pbix')">2. Visual, Accessories & Final Inspection Dashboard</div>
    </div>

    <!-- Work Instruction Section -->
    <div class="category" id="work-instruction">
      <h2>Work Instruction</h2>
      <div class="item" onclick="openLocalFile('C:/YourPath/workinstruction1.xlsx')">1. Aerial Angle Setting</div>
    </div>
  </div>

  <footer>
    <p>&copy; 2024 Hitachi Job Control Panel</p>
  </footer>

  <script>
    function openLocalFile(filePath) {
      alert(`Opening file: ${filePath}`);
      window.open(filePath, '_blank');
    }
  </script>
</body>
</html>
