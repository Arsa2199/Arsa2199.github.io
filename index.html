<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CTM Monitoring</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background-color: #f4f4f4;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin: 20px 0;
        }
        table, th, td {
            border: 1px solid #ddd;
        }
        th, td {
            padding: 10px;
            text-align: center;
        }
        th {
            background-color: #4CAF50;
            color: white;
        }
        .filter-container {
            margin-bottom: 20px;
        }
        select, input {
            padding: 8px;
            margin-right: 10px;
        }
        button {
            padding: 10px 15px;
            background-color: #4CAF50;
            color: white;
            border: none;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <h1>CTM Monitoring Dashboard</h1>

    <!-- Filter Section -->
    <div class="filter-container">
        <label for="country-filter">Filter by Destination:</label>
        <select id="country-filter">
            <option value="">All</option>
            <option value="ANGOLA">ANGOLA</option>
            <option value="BELGIUM">BELGIUM</option>
            <option value="CAMBODIA">CAMBODIA</option>
            <option value="ETHIOPIA">ETHIOPIA</option>
            <option value="INDONESIA">INDONESIA</option>
            <option value="LAOS">LAOS</option>
            <option value="MALAYSIA">MALAYSIA</option>
            <option value="MYANMAR">MYANMAR</option>
            <option value="NETHERLANDS">NETHERLANDS</option>
            <!-- Add more options as needed -->
        </select>
        
        <label for="judgment-filter">Filter by Judgment:</label>
        <select id="judgment-filter">
            <option value="">All</option>
            <option value="OK">OK</option>
            <option value="NG">NG</option>
            <option value="#N/A">#N/A</option>
        </select>

        <button onclick="applyFilters()">Apply Filters</button>
    </div>

    <!-- Data Table -->
    <table id="ctm-table">
        <thead>
            <tr>
                <th>Part Name</th>
                <th>Controller Type</th>
                <th>Part Number</th>
                <th>Destination</th>
                <th>Judgment (CTM HCM)</th>
                <th>Judgment (Checksheet)</th>
            </tr>
        </thead>
        <tbody>
            <!-- Sample Data Rows (Replace with actual data from your Excel) -->
            <tr>
                <td>RADIO</td>
                <td>YA00010689</td>
                <td>YA00010689</td>
                <td>ANGOLA</td>
                <td>ANGOLA</td>
                <td>NG</td>
            </tr>
            <tr>
                <td>RADIO</td>
                <td>YA00010689</td>
                <td>YA00010689</td>
                <td>BELGIUM</td>
                <td>BELGIUM</td>
                <td>OK</td>
            </tr>
            <tr>
                <td>RADIO</td>
                <td>YA00010689</td>
                <td>YA00010689</td>
                <td>CAMBODIA</td>
                <td>CAMBODIA</td>
                <td>NG</td>
            </tr>
            <!-- Add more data rows dynamically here -->
        </tbody>
    </table>

    <script>
        const table = document.getElementById("ctm-table");
        const countryFilter = document.getElementById("country-filter");
        const judgmentFilter = document.getElementById("judgment-filter");

        // Function to apply filters
        function applyFilters() {
            const countryValue = countryFilter.value.toUpperCase();
            const judgmentValue = judgmentFilter.value.toUpperCase();

            const rows = table.getElementsByTagName("tr");
            for (let i = 1; i < rows.length; i++) {
                const cells = rows[i].getElementsByTagName("td");
                const countryCell = cells[3].innerText.toUpperCase();
                const judgmentCell = cells[5].innerText.toUpperCase();

                if (
                    (countryValue === "" || countryCell.includes(countryValue)) &&
                    (judgmentValue === "" || judgmentCell.includes(judgmentValue))
                ) {
                    rows[i].style.display = "";
                } else {
                    rows[i].style.display = "none";
                }
            }
        }

        // Adding sorting functionality for the table
        function sortTable(n) {
            const rows = table.rows;
            let switching = true;
            let dir = "asc";
            while (switching) {
                switching = false;
                const rowsArray = Array.from(rows).slice(1);
                for (let i = 0; i < rowsArray.length - 1; i++) {
                    const x = rowsArray[i].getElementsByTagName("TD")[n];
                    const y = rowsArray[i + 1].getElementsByTagName("TD")[n];
                    if (dir === "asc" && x.innerHTML.toLowerCase() > y.innerHTML.toLowerCase() || 
                        dir === "desc" && x.innerHTML.toLowerCase() < y.innerHTML.toLowerCase()) {
                        rowsArray[i].parentNode.insertBefore(rowsArray[i + 1], rowsArray[i]);
                        switching = true;
                        break;
                    }
                }
                if (!switching && dir === "asc") {
                    dir = "desc";
                    switching = true;
                }
            }
        }

        // Add sorting to table headers
        const headers = table.querySelectorAll("th");
        headers.forEach((header, index) => {
            header.addEventListener("click", () => sortTable(index));
        });
    </script>
</body>
</html>
