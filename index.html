<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LIST SESERAHAN ARSA & DINDA CANTIK</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background-color: #ffeef7;
      margin: 0;
      padding: 0;
      color: #5a3c45;
    }
    header {
      text-align: center;
      padding: 20px;
      background: linear-gradient(135deg, #ffb6c1, #ffcce0);
      color: #fff;
      font-size: 1.8em;
      font-weight: bold;
      letter-spacing: 1px;
    }
    .container {
      max-width: 1000px;
      margin: 20px auto;
      padding: 20px;
    }
    .category {
      background: #fff;
      margin-bottom: 20px;
      border-radius: 15px;
      padding: 20px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.05);
    }
    .category h2 {
      color: #d63384;
      border-bottom: 2px solid #f7d6e6;
      padding-bottom: 10px;
    }
    .item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin: 10px 0;
      padding: 10px;
      border-bottom: 1px dashed #f1c6d9;
    }
    .item:last-child {
      border-bottom: none;
    }
    .item input[type="text"], .item input[type="number"] {
      padding: 5px;
      border: 1px solid #f7c6d9;
      border-radius: 8px;
      margin-left: 10px;
    }
    .item input[type="file"] {
      margin-left: 10px;
    }
    .item img {
      max-width: 60px;
      max-height: 60px;
      border-radius: 10px;
      margin-left: 10px;
    }
    .summary {
      background: #fff0f6;
      padding: 20px;
      border-radius: 15px;
      margin-top: 30px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.08);
    }
    .summary h2 {
      color: #c2185b;
      margin-bottom: 15px;
    }
    canvas {
      margin-top: 20px;
    }
    .bought {
      text-decoration: line-through;
      color: #999;
    }
  </style>
</head>
<body>
  <header>💖 LIST SESERAHAN ARSA & DINDA CANTIK 💖</header>
  <div class="container" id="giftList"></div>

  <div class="summary">
    <h2>💎 Summary</h2>
    <p><strong>Total Price: Rp <span id="totalPrice">0</span></strong></p>
    <canvas id="priceChart"></canvas>
  </div>

  <script>
    const categories = {
      "MAKE UP": [
        "Backstage Glow Face Pallete shade universa (Dior)",
        "Eyelash curler (lashboss)",
        "Addict Refillable shine lipstick shade 727 (Dior)",
        "Ysl touche glow pact cushion shade B20 (Ysl)",
        "Brush 3 pcs (aeris)",
        "Loose powder shade fair light (something)",
        "Beautybland (haquhara)",
        "Airbrush flawles setting spray (charlotte tilbury)",
        "Lume baked powder blush shade maja (guele)",
        "Cream blush (shade hope)",
        "Embryolisse lait cream (30ml)",
        "Noir lash mascara (instaperfect)"
      ],
      "PERLENGKAPAN IBADAH": [
        "Mukena (Heylocal)",
        "Sajadah (howel & co)",
        "Al quran mini",
        "Tasbih"
      ],
      "SKINCARE": [
        "Cleansing Oil (Centella madagascar 1004)",
        "Sabun cuci muka low Ph (Cosrx)",
        "Soothing toner (anua)",
        "Brightning capsule ampule (Centella skin 1004)",
        "Sunscreen hyalu cica water fit (Centella 1004)",
        "Cica pad (Npure)",
        "Sheet mask (Npure)",
        "Lait cream concentrate moisterizer (embryolise)"
      ],
      "BODYCARE": [
        "Almond milk scrub (The body shop)",
        "Almond milk body butter (The body shop)",
        "Body mist (bath and body works)",
        "Parfume (bebas apa aja)"
      ],
      "PERALATAN MANDI": [
        "Shower puff",
        "Handuk couple (howel & co)",
        "Sabun (bath and body works)",
        "Shampo (bath and body works)",
        "Cermin kecil"
      ],
      "ACCESSORIES": [
        "Tas tangan (charles and keith)",
        "Tas (teserah apa aja)",
        "Sneakers (teserah kamu aja)",
        "Heels (staccato/steve madden)",
        "Flatshoes (dianalable)"
      ],
      "BAKAL & BAJU": [
        "Pashmina viscose (hijabqa)",
        "Pashmina ceruty (daissy)",
        "Pashmina kaos (lafiye)",
        "Bakal baju 3 meter",
        "Renda baju 3 meter",
        "Baju (bebas apa aja)"
      ],
      "LAIN-LAIN": [
        "Piyama couple (bebas)",
        "Linggerie",
        "Daleman (3bra&3underware)",
        "Kain sarung 2 pcs",
        "Kain jarik barik 2 pcs",
        "Sisir"
      ]
    };

    const giftList = document.getElementById("giftList");
    let chart;

    function renderList() {
      giftList.innerHTML = "";
      for (let category in categories) {
        const catDiv = document.createElement("div");
        catDiv.className = "category";
        catDiv.innerHTML = `<h2>${category}</h2>`;
        categories[category].forEach((item, i) => {
          const itemDiv = document.createElement("div");
          itemDiv.className = "item";
          itemDiv.innerHTML = `
            <label>
              <input type="checkbox" onchange="toggleBought(this)">
              <span>${item}</span>
            </label>
            <input type="number" placeholder="Price (Rp)" onchange="updateSummary()">
            <input type="file" accept="image/*" onchange="showImage(this)">
            <img style="display:none">
          `;
          catDiv.appendChild(itemDiv);
        });
        giftList.appendChild(catDiv);
      }
    }

    function toggleBought(checkbox) {
      const span = checkbox.nextElementSibling;
      if (checkbox.checked) {
        span.classList.add("bought");
      } else {
        span.classList.remove("bought");
      }
    }

    function showImage(input) {
      const file = input.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function(e) {
          const img = input.nextElementSibling;
          img.src = e.target.result;
          img.style.display = "inline";
        }
        reader.readAsDataURL(file);
      }
    }

    function updateSummary() {
      let total = 0;
      let categoryTotals = {};
      document.querySelectorAll(".category").forEach(catDiv => {
        let catName = catDiv.querySelector("h2").innerText;
        let catTotal = 0;
        catDiv.querySelectorAll("input[type='number']").forEach(input => {
          let val = parseInt(input.value) || 0;
          catTotal += val;
        });
        categoryTotals[catName] = catTotal;
        total += catTotal;
      });
      document.getElementById("totalPrice").innerText = total.toLocaleString();

      const ctx = document.getElementById("priceChart").getContext("2d");
      if (chart) chart.destroy();
      chart = new Chart(ctx, {
        type: 'pie',
        data: {
          labels: Object.keys(categoryTotals),
          datasets: [{
            data: Object.values(categoryTotals),
            backgroundColor: [
              '#ffb6c1','#ffc0cb','#ff69b4','#ff1493',
              '#db7093','#c71585','#e75480','#f8a5c2'
            ]
          }]
        },
        options: {
          plugins: {
            legend: {
              position: 'bottom'
            }
          }
        }
      });
    }

    renderList();
  </script>
</body>
</html>
