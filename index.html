<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gift Tracker</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f5f7fa; padding: 20px; }
    header { text-align: center; margin-bottom: 20px; }
    h1 { margin-bottom: 10px; }
    #searchInput {
      padding: 10px; width: 80%; max-width: 400px;
      border-radius: 8px; border: 1px solid #bbb;
    }
    .progress-container {
      width: 100%; background: #ddd; border-radius: 8px;
      margin: 15px 0; height: 20px; overflow: hidden;
    }
    .progress-bar {
      height: 100%; background: #28a745; width: 0%; text-align: center;
      color: white; font-size: 12px; transition: width 0.4s ease;
    }
    table {
      width: 100%; border-collapse: collapse; margin-top: 20px;
      background: white; box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    }
    th, td {
      padding: 10px; border: 1px solid #ddd; text-align: center;
    }
    th { background: #007bff; color: white; }
    img {
      width: 80px; height: 80px; object-fit: cover;
      border-radius: 6px;
    }
    button {
      padding: 6px 10px; border: none; border-radius: 6px; cursor: pointer;
    }
    .buy-btn { background: #28a745; color: white; }
    .unbuy-btn { background: #dc3545; color: white; }
    input[type="number"] {
      width: 100px; padding: 5px; border-radius: 6px; border: 1px solid #bbb;
    }
    footer { text-align: center; margin-top: 30px; font-size: 13px; color: #777; }
  </style>
</head>
<body>
  <header>
    <h1>🎁 Gift Tracker</h1>
    <input type="text" id="searchInput" placeholder="Search gift...">
    <div class="progress-container">
      <div class="progress-bar" id="progressBar">0%</div>
    </div>
  </header>

  <main>
    <table id="giftTable">
      <thead>
        <tr>
          <th>Category</th>
          <th>Item</th>
          <th>Brand</th>
          <th>Price</th>
          <th>Status</th>
          <th>Photo</th>
          <th>Action</th>
          <th>Upload</th>
        </tr>
      </thead>
      <tbody id="giftBody"></tbody>
    </table>
  </main>

  <footer>
    <p>Gift Tracker • All data saved locally</p>
  </footer>

  <script>
    const gifts = [
      {category:"MAKE UP", item:"Backstage Glow Face Pallete shade universa", brand:"Dior"},
      {category:"MAKE UP", item:"Eyelash curler", brand:"Lashboss"},
      {category:"MAKE UP", item:"Addict Refillable shine lipstick shade 727", brand:"Dior"},
      {category:"MAKE UP", item:"Touche glow pact cushion shade B20", brand:"YSL"},
      {category:"MAKE UP", item:"Brush 3 pcs", brand:"Aeris"},
      {category:"MAKE UP", item:"Loose powder shade fair light", brand:"Something"},
      {category:"MAKE UP", item:"Beautybland", brand:"Haquhara"},
      {category:"MAKE UP", item:"Airbrush flawless setting spray", brand:"Charlotte Tilbury"},
      {category:"MAKE UP", item:"Lume baked powder blush shade Maja", brand:"Guele"},
      {category:"MAKE UP", item:"Cream blush shade Hope", brand:"-"},
      {category:"MAKE UP", item:"Embryolisse lait cream 30ml", brand:"Embryolisse"},
      {category:"MAKE UP", item:"Noir lash mascara", brand:"Instaperfect"},

      {category:"PERLENGKAPAN IBADAH", item:"Mukena", brand:"Heylocal"},
      {category:"PERLENGKAPAN IBADAH", item:"Sajadah", brand:"Howel & Co"},
      {category:"PERLENGKAPAN IBADAH", item:"Al Quran mini", brand:"-"},
      {category:"PERLENGKAPAN IBADAH", item:"Tasbih", brand:"-"},

      {category:"SKINCARE", item:"Cleansing Oil", brand:"Centella Madagascar 1004"},
      {category:"SKINCARE", item:"Sabun cuci muka low pH", brand:"Cosrx"},
      {category:"SKINCARE", item:"Soothing toner", brand:"Anua"},
      {category:"SKINCARE", item:"Brightening capsule ampoule", brand:"Centella Skin 1004"},
      {category:"SKINCARE", item:"Sunscreen hyalu cica water fit", brand:"Centella 1004"},
      {category:"SKINCARE", item:"Cica pad", brand:"Npure"},
      {category:"SKINCARE", item:"Sheet mask", brand:"Npure"},
      {category:"SKINCARE", item:"Moisturizer lait cream concentrate", brand:"Embryolisse"},

      {category:"BODYCARE", item:"Almond milk scrub", brand:"The Body Shop"},
      {category:"BODYCARE", item:"Almond milk body butter", brand:"The Body Shop"},
      {category:"BODYCARE", item:"Body mist", brand:"Bath and Body Works"},
      {category:"BODYCARE", item:"Parfume", brand:"Bebas"},

      {category:"PERALATAN MANDI", item:"Shower puff", brand:"-"},
      {category:"PERALATAN MANDI", item:"Handuk couple", brand:"Howel & Co"},
      {category:"PERALATAN MANDI", item:"Sabun", brand:"Bath and Body Works"},
      {category:"PERALATAN MANDI", item:"Shampo", brand:"Bath and Body Works"},
      {category:"PERALATAN MANDI", item:"Cermin kecil", brand:"-"},

      {category:"ACCESSORIES", item:"Tas tangan", brand:"Charles & Keith"},
      {category:"ACCESSORIES", item:"Tas", brand:"Bebas"},
      {category:"ACCESSORIES", item:"Sneakers", brand:"Bebas"},
      {category:"ACCESSORIES", item:"Heels", brand:"Staccato / Steve Madden"},
      {category:"ACCESSORIES", item:"Flatshoes", brand:"Dianalabelle"},

      {category:"BAKAL & BAJU", item:"Pashmina viscose", brand:"Hijabqa"},
      {category:"BAKAL & BAJU", item:"Pashmina ceruty", brand:"Daissy"},
      {category:"BAKAL & BAJU", item:"Pashmina kaos", brand:"Lafiye"},
      {category:"BAKAL & BAJU", item:"Bakal baju 3 meter", brand:"-"},
      {category:"BAKAL & BAJU", item:"Renda baju 3 meter", brand:"-"},
      {category:"BAKAL & BAJU", item:"Baju", brand:"Bebas"},

      {category:"LAIN-LAIN", item:"Piyama couple", brand:"Bebas"},
      {category:"LAIN-LAIN", item:"Lingerie", brand:"-"},
      {category:"LAIN-LAIN", item:"Daleman (3 bra & 3 underwear)", brand:"-"},
      {category:"LAIN-LAIN", item:"Kain sarung 2 pcs", brand:"-"},
      {category:"LAIN-LAIN", item:"Kain jarik batik 2 pcs", brand:"-"},
      {category:"LAIN-LAIN", item:"Sisir", brand:"-"}
    ];

    let saved = JSON.parse(localStorage.getItem("giftTrackerList")) || {};

    const tbody = document.getElementById("giftBody");
    const progressBar = document.getElementById("progressBar");

    function renderGifts(filter = "") {
      tbody.innerHTML = "";
      let boughtCount = 0;
      gifts.forEach((gift, idx) => {
        const key = gift.item;
        const data = saved[key] || { bought:false, image:null, price:"" };

        if (!gift.item.toLowerCase().includes(filter.toLowerCase()) &&
            !gift.category.toLowerCase().includes(filter.toLowerCase()) &&
            !gift.brand.toLowerCase().includes(filter.toLowerCase())) return;

        const tr = document.createElement("tr");

        tr.innerHTML = `
          <td>${gift.category}</td>
          <td>${gift.item}</td>
          <td>${gift.brand}</td>
          <td><input type="number" value="${data.price}" min="0" step="1000"></td>
          <td>${data.bought ? "✅ Bought" : "❌ Not bought"}</td>
          <td><img src="${data.image || "https://via.placeholder.com/80?text=No+Img"}"></td>
        `;

        // Action button
        const actionTd = document.createElement("td");
        const btn = document.createElement("button");
        btn.textContent = data.bought ? "Unbuy" : "Buy";
        btn.className = data.bought ? "unbuy-btn" : "buy-btn";
        btn.onclick = () => {
          data.bought = !data.bought;
          saved[key] = data;
          localStorage.setItem("giftTrackerList", JSON.stringify(saved));
          renderGifts(filter);
        };
        actionTd.appendChild(btn);
        tr.appendChild(actionTd);

        // Upload photo
        const uploadTd = document.createElement("td");
        const upload = document.createElement("input");
        upload.type = "file";
        upload.onchange = e => {
          const file = e.target.files[0];
          const reader = new FileReader();
          reader.onload = evt => {
            data.image = evt.target.result;
            saved[key] = data;
            localStorage.setItem("giftTrackerList", JSON.stringify(saved));
            renderGifts(filter);
          };
          reader.readAsDataURL(file);
        };
        uploadTd.appendChild(upload);
        tr.appendChild(uploadTd);

        // Price save event
        tr.querySelector("input").addEventListener("input", e => {
          data.price = e.target.value;
          saved[key] = data;
          localStorage.setItem("giftTrackerList", JSON.stringify(saved));
        });

        tbody.appendChild(tr);

        if (data.bought) boughtCount++;
      });

      // Progress bar update
      const percent = Math.round((boughtCount / gifts.length) * 100);
      progressBar.style.width = percent + "%";
      progressBar.textContent = percent + "%";
    }

    document.getElementById("searchInput").addEventListener("input", e => {
      renderGifts(e.target.value);
    });

    renderGifts();
  </script>
</body>
</html>
