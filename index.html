<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Communication Terminal Management</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- DataTables CSS -->
    <link rel="stylesheet" href="https://cdn.datatables.net/1.13.6/css/jquery.dataTables.min.css">
    <!-- Font Awesome for Icons -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">

    <style>
        body {
            background-color: #f4f6f9;
            font-family: Arial, sans-serif;
        }
        .status-ok {
            color: green;
            font-weight: bold;
        }
        .status-ng {
            color: red;
            font-weight: bold;
        }
        .status-n-a {
            color: gray;
            font-weight: bold;
        }
        .table-container {
            margin: 20px auto;
            max-width: 95%;
        }
        .title-header {
            background-color: #007bff;
            color: #fff;
            padding: 15px;
            text-align: center;
            margin-bottom: 20px;
            border-radius: 5px;
        }
    </style>
</head>
<body>
    <!-- Header -->
    <div class="title-header">
        <h1>Communication Terminal Management Status</h1>
        <p>Interactive Monitoring System</p>
    </div>

    <!-- Table Container -->
    <div class="table-container">
        <table id="status-table" class="table table-striped table-bordered">
            <thead class="table-dark">
                <tr>
                    <th>Part Name</th>
                    <th>Controller Type</th>
                    <th>Part Number</th>
                    <th>Destination</th>
                    <th>Judgement from CTH HCM</th>
                    <th>Judgement for Checksheet</th>
                </tr>
            </thead>
            <tbody>
                <!-- Data will be inserted dynamically here -->
            </tbody>
        </table>
    </div>

    <!-- Footer -->
    <div class="text-center mt-4">
        <p>&copy; 2024 Communication Terminal Monitoring System</p>
    </div>

    <!-- JQuery and Bootstrap JS -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- DataTables JS -->
    <script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>

    <script>
        // Sample data - Replace this with JSON from your backend
        const data = [
            { "part_name": "AGO", "controller_type": "VA00010689", "part_number": "AGOY00010689", "destination": "ANGOLA", "judgement_cth": "OK", "judgement_checksheet": "NG" },
            { "part_name": "BEL", "controller_type": "VA00010689", "part_number": "BELY00010689", "destination": "BELGIUM", "judgement_cth": "OK", "judgement_checksheet": "OK" },
            { "part_name": "PHL", "controller_type": "4174374", "part_number": "PHLY4174374", "destination": "PHILIPPINES", "judgement_cth": "OK", "judgement_checksheet": "OK" },
            { "part_name": "SGP", "controller_type": "VA00010689", "part_number": "SGPY00010689", "destination": "SINGAPORE", "judgement_cth": "NG", "judgement_checksheet": "OK" },
            { "part_name": "THA", "controller_type": "4635318", "part_number": "THAY4635318", "destination": "THAILAND", "judgement_cth": "N/A", "judgement_checksheet": "N/A" }
        ];

        // Function to generate table rows dynamically
        function populateTable(data) {
            const tableBody = document.querySelector("#status-table tbody");
            tableBody.innerHTML = "";

            data.forEach(item => {
                const row = document.createElement("tr");

                // Status Formatting
                const judgementCTHClass = formatStatus(item.judgement_cth);
                const judgementChecksheetClass = formatStatus(item.judgement_checksheet);

                row.innerHTML = `
                    <td>${item.part_name}</td>
                    <td>${item.controller_type}</td>
                    <td>${item.part_number}</td>
                    <td>${item.destination}</td>
                    <td class="${judgementCTHClass}">${item.judgement_cth}</td>
                    <td class="${judgementChecksheetClass}">${item.judgement_checksheet}</td>
                `;

                tableBody.appendChild(row);
            });
        }

        // Function to apply color formatting based on status
        function formatStatus(status) {
            if (status === "OK") return "status-ok";
            if (status === "NG") return "status-ng";
            return "status-n-a";
        }

        // Initialize DataTables and Populate Data
        $(document).ready(function () {
            populateTable(data); // Populate the table with data

            // Initialize DataTable plugin
            $('#status-table').DataTable({
                responsive: true
            });
        });
    </script>
</body>
</html>
