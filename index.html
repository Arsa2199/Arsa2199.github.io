<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced Quality Control Portal</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background: #f0f0f0;
            margin: 0;
            color: #333;
        }
        header {
            background: linear-gradient(90deg, #ff7e00, #000);
            color: white;
            padding: 20px 0;
            text-align: center;
        }
        header h1 {
            margin: 0;
            font-size: 2.5em;
            font-weight: bold;
        }
        nav a {
            color: white;
            margin: 0 15px;
            text-decoration: none;
            font-weight: bold;
            transition: color 0.3s;
        }
        nav a:hover {
            color: #ff7e00;
        }
        .container {
            background: white;
            border-radius: 8px;
            margin: 20px auto;
            padding: 20px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
        h2 {
            color: #ff7e00;
            border-bottom: 2px solid #ff7e00;
            padding-bottom: 5px;
            margin-bottom: 20px;
        }
        ul {
            list-style-type: none;
            padding: 0;
        }
        li {
            padding: 10px;
            border-bottom: 1px solid #ddd;
        }
        li a {
            text-decoration: none;
            color: #333;
        }
        li a:hover {
            color: #ff7e00;
        }
        footer {
            background: #000;
            color: white;
            text-align: center;
            padding: 10px;
            margin-top: 20px;
        }
    </style>
</head>
<body>

<header>
    <h1>Advanced Quality Control Portal</h1>
    <nav>
        <a href="#dashboards">Dashboards</a>
        <a href="#work-instructions">Work Instructions</a>
        <a href="#operations">Operations</a>
        <a href="#checksheet">Checksheet</a>
        <a href="#master-data">Master Data</a>
    </nav>
</header>

<div class="container" id="dashboards">
    <h2>Dashboards</h2>
    <ul>
        <li><a href="#" onclick="openFile()">1. Blacklight & Performance Test Dashboard</a></li>
        <li><a href="#" onclick="openFile()">2. Visual, Accessories & Final Inspection Dashboard</a></li>
        <!-- Add similar links -->
    </ul>
</div>

<!-- Other sections can be updated similarly -->

<footer>
    <p>&copy; 2023 Quality Control Department. All rights reserved.</p>
    <p>Job Control Website</p>
</footer>

<script>
    function openFile() {
        const input = document.createElement('input');
        input.type = 'file';
        input.accept = '*/*'; // Adjust file type if needed
        input.onchange = (event) => {
            const file = event.target.files[0];
            if (file) {
                alert(`File "${file.name}" selected!`);
                // Further file handling logic can go here
            }
        };
        input.click();
    }
</script>

</body>
</html>
