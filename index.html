<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>LIST SESERAHAN ARSA & DINDA CANTIK</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Parisienne&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore.js"></script>
  <style>
    body {
      margin: 0;
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg, #ffe6f2, #fff0f5, #ffeaf6);
      color: #444;
      overflow-x: hidden;
    }
    header {
      text-align: center;
      padding: 30px;
      background: #ffb6c1;
      color: #fff;
      border-bottom: 5px solid #ff8da1;
    }
    header h1 {
      font-family: 'Parisienne', cursive;
      font-size: 3em;
      margin: 0;
    }
    .container {
      max-width: 1100px;
      margin: 30px auto;
      background: #fff;
      border-radius: 20px;
      padding: 20px;
      box-shadow: 0 8px 20px rgba(255, 182, 193, 0.5);
      position: relative;
      z-index: 1;
    }
    .item-form {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }
    .item-form input, .item-form button {
      padding: 10px;
      border-radius: 10px;
      border: 1px solid #ddd;
      font-size: 14px;
    }
    .item-form button {
      background: #ff8da1;
      color: #fff;
      border: none;
      cursor: pointer;
      transition: 0.3s;
    }
    .item-form button:hover {
      background: #ff5c7a;
    }
    ul {
      list-style: none;
      padding: 0;
    }
    li {
      background: #fff0f5;
      margin: 10px 0;
      padding: 15px;
      border-radius: 15px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 4px 10px rgba(255, 182, 193, 0.4);
      animation: fadeIn 0.5s ease;
    }
    li span {
      font-weight: 500;
    }
    .summary {
      margin-top: 30px;
      background: #ffe6f2;
      border-radius: 20px;
      padding: 20px;
      box-shadow: inset 0 4px 12px rgba(255, 182, 193, 0.3);
    }
    .floating-hearts {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      overflow: hidden;
      z-index: 0;
    }
    .heart {
      position: absolute;
      color: #ff8da1;
      font-size: 20px;
      animation: float 6s infinite ease-in;
    }
    @keyframes float {
      from { transform: translateY(100vh) scale(0.5); opacity: 0; }
      to { transform: translateY(-10vh) scale(1.2); opacity: 1; }
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  <header>
    <h1>💖 LIST SESERAHAN ARSA & DINDA 💖</h1>
    <p>Soft pink elegance seserahan tracker ✨</p>
  </header>

  <div class="container">
    <form class="item-form" id="itemForm">
      <input type="text" id="itemName" placeholder="Nama Barang" required>
      <input type="text" id="itemBrand" placeholder="Merek" required>
      <input type="number" id="itemPrice" placeholder="Harga (Rp)" required>
      <button type="submit">Tambah</button>
    </form>

    <ul id="itemList"></ul>

    <div class="summary">
      <h2>📊 Ringkasan Harga</h2>
      <canvas id="priceChart"></canvas>
    </div>
  </div>

  <div class="floating-hearts" id="hearts"></div>

  <script type="module">
    // --- Firebase Config ---
    const firebaseConfig = {
      apiKey: "YOUR_API_KEY",
      authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
      projectId: "YOUR_PROJECT_ID",
      storageBucket: "YOUR_PROJECT_ID.appspot.com",
      messagingSenderId: "YOUR_SENDER_ID",
      appId: "YOUR_APP_ID"
    };
    const app = firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    const itemForm = document.getElementById("itemForm");
    const itemList = document.getElementById("itemList");
    const priceChartCtx = document.getElementById("priceChart").getContext("2d");

    let chart;

    // Add item to Firestore
    itemForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      const name = document.getElementById("itemName").value;
      const brand = document.getElementById("itemBrand").value;
      const price = parseInt(document.getElementById("itemPrice").value);

      await db.collection("seserahan").add({ name, brand, price });
      itemForm.reset();
    });

    // Realtime listener
    db.collection("seserahan").onSnapshot((snapshot) => {
      itemList.innerHTML = "";
      const items = [];
      snapshot.forEach((doc) => {
        const item = doc.data();
        items.push(item);

        const li = document.createElement("li");
        li.innerHTML = `<span>${item.name} (${item.brand}) - Rp ${item.price.toLocaleString()}</span>`;
        itemList.appendChild(li);
      });

      updateChart(items);
    });

    // Update chart
    function updateChart(items) {
      const labels = items.map(i => i.name);
      const prices = items.map(i => i.price);

      if (chart) chart.destroy();
      chart = new Chart(priceChartCtx, {
        type: "bar",
        data: {
          labels,
          datasets: [{
            label: "Harga (Rp)",
            data: prices,
            backgroundColor: "#ff8da1"
          }]
        },
        options: {
          responsive: true,
          plugins: { legend: { display: false } }
        }
      });
    }

    // Floating hearts animation
    function createHeart() {
      const heart = document.createElement("div");
      heart.classList.add("heart");
      heart.innerHTML = "💖";
      heart.style.left = Math.random() * 100 + "vw";
      heart.style.fontSize = (Math.random() * 20 + 15) + "px";
      heart.style.animationDuration = (Math.random() * 3 + 3) + "s";
      document.getElementById("hearts").appendChild(heart);

      setTimeout(() => heart.remove(), 6000);
    }
    setInterval(createHeart, 1000);
  </script>
</body>
</html>
