<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced Communication Monitoring</title>

    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <!-- DataTables CSS -->
    <link rel="stylesheet" href="https://cdn.datatables.net/1.13.6/css/jquery.dataTables.min.css">
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f9f9f9;
        }
        h1 {
            text-align: center;
            margin-top: 20px;
        }
        .status-ok {
            color: green;
            font-weight: bold;
        }
        .status-ng {
            color: red;
            font-weight: bold;
        }
        .status-n-a {
            color: gray;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <!-- Page Title -->
    <h1>Communication Terminal Monitoring</h1>

    <!-- Table -->
    <div class="container mt-4">
        <table id="monitoring-table" class="table table-striped table-bordered">
            <thead class="table-dark">
                <tr>
                    <th>Part Name</th>
                    <th>Controller Type</th>
                    <th>Part Number</th>
                    <th>Destination</th>
                    <th>Judgement from CTH HCM</th>
                    <th>Judgement for Checksheet</th>
                </tr>
            </thead>
            <tbody>
                <!-- Data loaded dynamically -->
            </tbody>
        </table>
    </div>

    <!-- Chart -->
    <div class="container mt-5">
        <h3>Status Summary</h3>
        <canvas id="statusChart"></canvas>
    </div>

    <!-- Footer -->
    <footer class="text-center mt-5">
        <p>&copy; 2024 Advanced Monitoring System</p>
    </footer>

    <!-- JS Libraries -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>
    <script>
        async function fetchData() {
            const response = await fetch("/api/data");
            return response.json();
        }

        function formatStatus(status) {
            if (status === "OK") return "status-ok";
            if (status === "NG") return "status-ng";
            return "status-n-a";
        }

        async function populateTable() {
            const data = await fetchData();
            const tableBody = document.querySelector("#monitoring-table tbody");

            data.forEach(row => {
                const cthStatus = formatStatus(row["JUDGEMENT FROM CTH HCM"]);
                const checkSheetStatus = formatStatus(row["JUDGEMENT FOR CHECKSHEET"]);

                const tr = `
                    <tr>
                        <td>${row["PART NAME"]}</td>
                        <td>${row["CONTROLLER TYPE"]}</td>
                        <td>${row["PART NUMBER"]}</td>
                        <td>${row["DESTINATION"]}</td>
                        <td class="${cthStatus}">${row["JUDGEMENT FROM CTH HCM"]}</td>
                        <td class="${checkSheetStatus}">${row["JUDGEMENT FOR CHECKSHEET"]}</td>
                    </tr>
                `;
                tableBody.insertAdjacentHTML("beforeend", tr);
            });

            $("#monitoring-table").DataTable();
        }

        async function generateChart() {
            const data = await fetchData();
            const statusCounts = { OK: 0, NG: 0, N_A: 0 };

            data.forEach(row => {
                const status = row["JUDGEMENT FOR CHECKSHEET"];
                if (status === "OK") statusCounts.OK++;
                else if (status === "NG") statusCounts.NG++;
                else statusCounts.N_A++;
            });

            const ctx = document.getElementById("statusChart").getContext("2d");
            new Chart(ctx, {
                type: "pie",
                data: {
                    labels: ["OK", "NG", "N/A"],
                    datasets: [{
                        data: [statusCounts.OK, statusCounts.NG, statusCounts.N_A],
                        backgroundColor: ["#28a745", "#dc3545", "#6c757d"]
                    }]
                }
            });
        }

        document.addEventListener("DOMContentLoaded", () => {
            populateTable();
            generateChart();
        });
    </script>
</body>
</html>
